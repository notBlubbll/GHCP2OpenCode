name: Bump Version

on:
  push:
    branches: [main]
    paths-ignore:
      - '.version'
      - '**.md'
      - '.github/workflows/**'

concurrency:
  group: version-bump-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bump:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Bump version
        run: |
          date +%s000 > .version
          echo "Ticks: $(cat .version)"

      - name: Commit version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .version
          git diff --staged --quiet || git commit -m "bump version [skip ci]"
          git push
